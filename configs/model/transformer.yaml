# Structured Transformer Model Configuration
# See IMPLEMENTATION_PLAN.md Phase 4 for architecture details.

# Scaling ladder stages: smoke -> small -> medium -> full
defaults:
  - _self_

# Encoder
num_layers: 6
hidden_dim: 384
num_heads: 6
dropout: 0.1
activation: gelu

# Input
history_length: 20          # Number of past turns to include
max_team_size: 6
max_moves_per_pokemon: 4
max_candidate_actions: 10   # 4 moves (+ Tera variants) + 5 switches

# Embeddings
species_embedding_dim: 64
move_embedding_dim: 32
item_embedding_dim: 32
ability_embedding_dim: 32
type_embedding_dim: 16

# Auxiliary hidden-info head
auxiliary_loss_weight: 0.2   # Tune via ablation: 0, 0.1, 0.3, 0.5
num_item_classes: 50         # Top items in metagame
num_speed_buckets: 5         # Very fast, fast, medium, slow, very slow
num_role_archetypes: 8       # Sweeper, wall, pivot, setter, etc.
num_tera_categories: 4       # Offensive, defensive, STAB, coverage
num_move_families: 10        # Priority, recovery, hazards, status, etc.

# Value head (optional)
use_value_head: true
value_loss_weight: 0.1
